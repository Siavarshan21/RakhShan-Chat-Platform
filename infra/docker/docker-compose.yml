version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rakhshan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rakhshan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rakhshan_secret}
      POSTGRES_DB: ${POSTGRES_DB:-rakhshan_chat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rakhshan}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rakhshan-network

  redis:
    image: redis:7-alpine
    container_name: rakhshan-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rakhshan-network

  minio:
    image: minio/minio:latest
    container_name: rakhshan-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rakhshan-network

  backend:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.backend
    container_name: rakhshan-backend
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rakhshan}:${POSTGRES_PASSWORD:-rakhshan_secret}@postgres:5432/${POSTGRES_DB:-rakhshan_chat}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rakhshan-network

  nginx:
    image: nginx:alpine
    container_name: rakhshan-nginx
    restart: unless-stopped
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - backend
    networks:
      - rakhshan-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  rakhshan-network:
    driver: bridge
